{% extends "registration/_auth_base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block auth_content %}
<h1>Iniciar sesión</h1>
<form method="post" class="flex flex-col gap-4" novalidate>
  {% csrf_token %}
  {% include "registration/_form_fields.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="btn-primary w-full">Entrar</button>
</form>
<p class="text-center text-xs"><a href="{% url 'accounts:password_reset' %}">¿Olvidaste tu contraseña?</a></p>
{% endblock %}
