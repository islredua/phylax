{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_actions %}<a href="{% url 'users:detail' target.pk %}" class="btn-secondary btn-sm">← {{ target.username }}</a>{% endblock %}
{% block content %}
<section class="card flex max-w-lg flex-col gap-4">
  <dl><dt class="kv-label">Usuario</dt><dd class="kv-value font-mono">{{ target.username }}</dd></dl>
  <p class="muted">{{ description }}</p>
  <form method="post" class="flex gap-2">
    {% csrf_token %}
    <button type="submit" class="{% if danger %}btn-danger{% else %}btn-primary{% endif %}">{{ confirm_label }}</button>
    <a href="{% url 'users:detail' target.pk %}" class="btn-secondary">Cancelar</a>
  </form>
</section>
{% endblock %}
