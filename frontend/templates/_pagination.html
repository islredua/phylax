{% if is_paginated %}
<nav class="flex items-center justify-between" aria-label="Paginación">
  {% if page_obj.has_previous %}<a class="btn-secondary btn-sm" href="{% querystring page=page_obj.previous_page_number %}">← Anterior</a>{% else %}<span></span>{% endif %}
  <span class="font-mono text-xs text-muted">Página {{ page_obj.number }} de {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn-secondary btn-sm" href="{% querystring page=page_obj.next_page_number %}">Siguiente →</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
