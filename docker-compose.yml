# Phylax — despliegue on-premise.
#
#   scripts/compose.sh up -d      # detecta GPU NVIDIA y añade docker-compose.gpu.yml
#   docker compose up -d          # equivalente sin GPU
#
# Ningún servicio interno (Redis, Ollama, workers) publica puertos: solo la red
# phylax-net los alcanza (STRIDE Information Disclosure).

# Una sola imagen: la construye `backend`; los workers la reutilizan.
x-backend: &backend
  image: phylax-backend:dev
  pull_policy: never
  restart: unless-stopped
  env_file:
    - .env
  environment: &backend-env
    PYTHONUNBUFFERED: 1
    REDIS_URL: redis://redis:6379/0
    PHYLAX_MEDIA_ROOT: /data/media
  volumes:
    - ./backend:/app
    # Templates y estáticos viven fuera de backend/ (settings: BASE_DIR.parent / "frontend").
    - ./frontend:/frontend:ro
    - media:/data/media
    - scan_results:/data/scan-results
    - cti_cache:/data/cti-cache
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "celery -A phylax inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
  interval: 60s
  timeout: 20s
  retries: 3
  start_period: 30s

services:
  db:
    image: postgres:16-alpine
    container_name: phylax-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.1-alpine
    container_name: phylax-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    <<: *backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: build
    container_name: phylax-backend
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Inventario, importaciones CSV y tareas generales.
  worker:
    <<: *backend
    container_name: phylax-worker
    command: celery -A phylax worker -Q default -c 2 -n celery@%h --loglevel INFO
    healthcheck: *worker-healthcheck

  # Inferencia LLM: concurrencia 1 para no saturar la GPU (o la CPU).
  worker-llm:
    <<: *backend
    container_name: phylax-worker-llm
    command: celery -A phylax worker -Q llm -c 1 -n celery@%h --loglevel INFO
    healthcheck: *worker-healthcheck

  # Descubrimiento con nmap: concurrencia 1.
  worker-discovery:
    <<: *backend
    container_name: phylax-worker-discovery
    command: celery -A phylax worker -Q discovery -c 1 -n celery@%h --loglevel INFO
    healthcheck: *worker-healthcheck

  beat:
    <<: *backend
    container_name: phylax-beat
    command: celery -A phylax beat --schedule /tmp/celerybeat-schedule --loglevel INFO

volumes:
  postgres_data:
  media:
  scan_results:
  cti_cache:

networks:
  default:
    name: phylax-net
