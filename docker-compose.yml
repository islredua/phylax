# Atalaya — despliegue on-premise.
#
#   scripts/compose.sh up -d      # detecta GPU NVIDIA y añade docker-compose.gpu.yml
#   docker compose up -d          # equivalente sin GPU (Ollama en CPU)
#
# Este archivo es el entorno de **desarrollo y laboratorio** (runserver, código montado). Para
# uso real se suma docker-compose.prod.yml (ATALAYA_PROFILE=prod scripts/compose.sh up -d):
# proxy con TLS, gunicorn y ningún puerto interno publicado. Ver docs/operacion.md.
#
# Ningún servicio interno (Redis, Ollama, workers) publica puertos: solo la red
# atalaya-net los alcanza (STRIDE Information Disclosure).

# Una sola imagen: la construye `backend`; los workers la reutilizan.
x-backend: &backend
  image: atalaya-backend:dev
  pull_policy: never
  restart: unless-stopped
  env_file:
    - .env
  environment: &backend-env
    PYTHONUNBUFFERED: 1
    REDIS_URL: redis://redis:6379/0
    ATALAYA_MEDIA_ROOT: /data/media
  volumes:
    - ./backend:/app
    # Templates y estáticos viven fuera de backend/ (settings: BASE_DIR.parent / "frontend").
    - ./frontend:/frontend:ro
    - media:/data/media
    # Datasets y resultados de la evaluación de LLMs (eval_criticality).
    - ./datasets:/datasets:ro
    - ./experiments:/experiments
    - scan_results:/data/scan-results
    - cti_cache:/data/cti-cache
    # CA interna de la organización (certificado del servidor de correo): DJANGO_EMAIL_CA_FILE.
    - ./deploy/ca:/ca:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "celery -A atalaya inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
  interval: 60s
  timeout: 20s
  retries: 3
  start_period: 30s

services:
  db:
    image: postgres:16-alpine
    container_name: atalaya-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Solo en el propio equipo (psql, respaldos a mano); el perfil de producción lo quita.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.1-alpine
    container_name: atalaya-redis
    restart: unless-stopped
    # La cola de Celery vive aquí: con el registro de solo-añadir (un fsync por segundo) las
    # tareas encoladas sobreviven a un reinicio de Redis o del equipo. Antes no se guardaba nada
    # y un reinicio las perdía (revisión del 2026-11-16, O2).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LLM local. Sin puertos publicados: solo los workers lo alcanzan por la red interna.
  # Modelos en el volumen ollama_models: docker compose exec ollama ollama pull <modelo>
  ollama:
    image: ollama/ollama:0.5.7
    container_name: atalaya-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    <<: *backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: build
    container_name: atalaya-backend
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Inventario, importaciones CSV y tareas generales.
  worker:
    <<: *backend
    container_name: atalaya-worker
    command: celery -A atalaya worker -Q default -c 2 -n celery@%h --loglevel INFO
    healthcheck: *worker-healthcheck

  # Inferencia LLM: concurrencia 1 para no saturar la GPU (o la CPU).
  worker-llm:
    <<: *backend
    container_name: atalaya-worker-llm
    command: celery -A atalaya worker -Q llm -c 1 -n celery@%h --loglevel INFO
    healthcheck: *worker-healthcheck

  # Descubrimiento con nmap: concurrencia 1, usuario no root con capabilities de red
  # (nmap --privileged usa las capabilities de archivo del binario). Solo alcanza los
  # segmentos con ruta desde este host; la MAC solo se ve en el mismo segmento L2.
  worker-discovery:
    <<: *backend
    container_name: atalaya-worker-discovery
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command: celery -A atalaya worker -Q discovery -c 1 -n celery@%h --loglevel INFO
    healthcheck: *worker-healthcheck

  beat:
    <<: *backend
    container_name: atalaya-beat
    command: celery -A atalaya beat --schedule /tmp/celerybeat-schedule --loglevel INFO

volumes:
  postgres_data:
  redis_data:
  ollama_models:
  media:
  scan_results:
  cti_cache:

networks:
  default:
    name: atalaya-net
