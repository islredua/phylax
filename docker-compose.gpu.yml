# Override para equipos con GPU NVIDIA (requiere NVIDIA Container Toolkit / Docker Desktop con WSL2).
# scripts/compose.sh lo añade automáticamente si detecta la GPU:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  ollama:
    environment:
      # Un solo hilo de inferencia: la caché KV baja de 896 MiB a 224 MiB y el modelo de 7B
      # cabe entero en los 8 GiB de la GPU sin desbordar a RAM compartida (WDDM/WSL2).
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  # Pista para Atalaya: timeouts de GPU y estado "GPU" mientras no haya modelo cargado.
  backend:
    environment:
      LLM_ACCELERATOR: gpu
  worker:
    environment:
      LLM_ACCELERATOR: gpu
  worker-llm:
    environment:
      LLM_ACCELERATOR: gpu
  beat:
    environment:
      LLM_ACCELERATOR: gpu
